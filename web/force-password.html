<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>修改初始密码 · ops-panel</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="login-wrap">
  <form class="login-card" id="form">
    <h1>修改初始密码</h1>
    <div class="sub">首次登录必须先改密码，改完才能进入面板</div>
    <input type="password" id="cur" placeholder="当前密码（安装时生成的）" autocomplete="current-password" autofocus>
    <input type="password" id="new1" placeholder="新密码（至少 8 位）" autocomplete="new-password">
    <input type="password" id="new2" placeholder="再输一次新密码" autocomplete="new-password">
    <button class="primary" type="submit">保存并进入</button>
    <div class="login-err" id="err"></div>
  </form>
</div>
<script>
document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('err');
  err.textContent = '';
  if (document.getElementById('new1').value !== document.getElementById('new2').value) {
    err.textContent = '两次新密码不一致';
    return;
  }
  const res = await fetch('/api/security/password', {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'X-Ops': '1'},
    body: JSON.stringify({
      current: document.getElementById('cur').value,
      new: document.getElementById('new1').value,
    }),
  });
  const data = await res.json().catch(() => ({}));
  if (res.ok && data.ok) {
    alert('密码已修改，请用新密码重新登录');
    location.href = '/login';
  }
  else { err.textContent = data.error || '修改失败'; }
});
</script>
</body>
</html>
